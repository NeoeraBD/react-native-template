name: CI Pipeline (Pull Request & Merge Validation)

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

jobs:
  validate:
    name: Lint & Typecheck Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"
          cache-dependency-path: "./template/yarn.lock"

      - name: Install Dependencies
        run: cd template && yarn install --frozen-lockfile

      - name: Run Code Style & Linter Check (ESLint)
        run: cd template && yarn lint

      - name: Run TypeScript Type Validation (Typecheck)
        run: cd template && yarn tsc -p tsconfig.json --noEmit
